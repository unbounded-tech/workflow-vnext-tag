name: On Tag, Trigger GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  call-release-workflow:
    uses: unbounded-tech/workflow-simple-release/.github/workflows/workflow.yaml@d577e3b6df67795ece619270377bb551703cf2fe # v2.1.3
    with:
      tag: ${{ github.ref_name }}
      name: ${{ github.ref_name }}
