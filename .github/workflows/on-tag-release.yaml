name: On Tag, Trigger GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  call-release-workflow:
    uses: unbounded-tech/workflow-simple-release/.github/workflows/workflow.yaml@667d60d6fc858aefa64952556e4d17e98b95b5af # v2.1.4
    with:
      tag: ${{ github.ref_name }}
      name: ${{ github.ref_name }}
